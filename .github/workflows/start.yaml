name: Compose Up

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  #schedule:
  #  - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies on runner
        run: pip install -r requirements.txt

      # ONLY USE IF EXTERNAL VOLUME WAS REMOVE 
      #- name: Writes / Create Essentials Files
      #  run: python -m start_kit.repo_start

      - name: Run pipeline via Docker Compose
        env:
          USER_PATH: ${{ secrets.ENV_USER_PATH }}      
        run: |
          $path = $env:USER_PATH
          docker compose --env-file "$path/.env" up -d --build