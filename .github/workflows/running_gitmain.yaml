name: GitActions - ETL only

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get Git Kit / Token / Header for Requests
        shell: python
        run: |
          import json
          import os
          os.makedirs('config', exist_ok=True)
          secret_data = """${{ secrets.GITHUB }}"""
          with open('config/git.json', 'w', encoding='utf-8') as f:
              f.write(secret_data)

      - name: Connection Kit to localhost MySQL Database
        run: |
          echo '${{ secrets.MYSQL }}' > config/mysql.json

      - name: Get Service Account for MySQL -> BigQuery
        run: |
          echo '${{ secrets.IZZO }}' > config/izzo.json

      - name: commit full workflow
        run: python -m main.gitmain