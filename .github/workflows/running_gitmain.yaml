name: GitActions - ETL only

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Copnnection-Kit / Token / Header for Requests
        shell: python
        run: |
          import os
          os.makedirs('config', exist_ok=True)
                
          secrets_data = [  """${{ secrets.GITHUB }}""", """${{ secrets.LARK }}""", """${{ secrets.LARKTABLE }}""", """${{ secrets.MYSQL }}""", """${{ secrets.IZZO }}""" ]
          secrets_key = [ 'config/git.json', 'config/lark.json', 'config/lark_report_tables.json', 'config/mysql.json', 'config/izzo.json' ]
                
          for data, key in zip( secrets_data, secrets_key ):
              with open(key, 'w', encoding='utf-8') as f:
                  f.write(data)

      - name: commit full workflow
        run: python -m main.gitmain