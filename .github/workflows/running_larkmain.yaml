name: LarkCRM - ETL only

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get Lark Kit / Token / Header larkoapi
        run: |
          echo '${{ secrets.lark }}' > config/lark.json

      - name: Get Lark Report Table ID
        run: |
          echo '${{ secrets.larktable }}' > config/lark_report_tables.json

      - name: Connection Kit to localhost MySQL Database
        run: |
          echo '${{ secrets.mysql }}' > config/mysql.json

      - name: Get Service Account for MySQL -> BigQuery
        run: |
          echo '${{ secrets.izzo }}' > config/izzo.json

      - name: commit full workflow
        run: python -m main.larkmain